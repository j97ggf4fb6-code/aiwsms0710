<script>

function drawDex(){$('dty').innerHTML=DT.map(([k,n])=>`<button data-k="${k}" class="${DX.ty==k?'on':''}">${n}</button>`).join('');$('del').innerHTML=DE.map(([k,n])=>`<button data-k="${k}" class="${DX.el==k?'on':''}">${n}</button>`).join('');const L=CARDS.filter(c=>(!DX.ty||c.k==DX.ty)&&(!DX.el||c.e==DX.el));$('dc2').textContent=`収録 ${L.length}/${CARDS.length} 枚 ・ タップで詳細`;$('dg').innerHTML=L.map(c=>`<div class=gi>${ch(c,c.a||0)}</div>`).join('')||'該当なし'}

const mc=i=>`<span class=tc>${ch(CARDS[i],CARDS[i].a||0)}</span>`;
const TU=[['勝利条件','相手のLPを0にすれば勝ち。自分のLPが0になると負け。CPUレベルを高くすると相手のLPと強さが上がる。<div class=tr>'+mc(8)+mc(7)+'</div>'],
['ターンの流れ','毎ターン、マナが1増え(最大7)、山札から1枚引く。マナの範囲でカードを使い、モンスターで攻撃して「ターン終了」を押す。カード左上の数字がコスト。'],
['モンスターと攻撃','手札をタップし、光る空き枠をタップして召喚。召喚したターンは攻撃できない(速攻を除く)。水色に光るモンスターをタップし、敵モンスターか相手のLPをタップ。攻撃力が高い方が生き残り、差がLPダメージ。同値は相打ち。相手の場が空なら直接攻撃。<div class=tr>'+mc(2)+mc(5)+'</div>'],
['魔法','手札をタップして選び、もう一度タップで発動。ダメージ・回復・ドロー・破壊・強化など、強力な効果をすぐに使える。使った魔法は墓地へ。<div class=tr>'+mc(9)+mc(12)+'</div>'],
['罠と伏せ札','罠カードは選んで罠ゾーン(場の手前の細長い枠)をタップして伏せる。相手の攻撃・召喚・魔法に反応して自動で発動する。<div class=tr>'+mc(14)+mc(16)+'</div>'],
['心理戦','「伏せる」ボタンで、どのカードも囮として伏せられる(マナ1)。相手には罠か囮か分からない。伏せ札が多いとAIは攻撃をらう。マナを使わずに残すのもブラフ。「感情」で相手に一言送れる。'],
['コツ','・カードを長押しすると拡大表示。<br>・墓地をタップすると中身が見られる。<br>・山札が尽きても負けにはならない。<br>・この図鑑で全カードの効果を確認しよう。<br>・友達とはオンライン対戦で読み合いを。']];
let tpg=0;function tut(){$('tt').textContent=TU[tpg][0];$('tb').innerHTML=TU[tpg][1];$('td').textContent=(tpg+1)+' / '+TU.length;$('tu1').style.visibility=tpg?'visible':'hidden';$('tn').textContent=tpg==TU.length-1?'完了':'次へ'}

const EM=['かかってこい','読み通りだ','何を伏せた？','いい勝負だ'];
function emote(s,i){const r=$('lp-'+s).getBoundingClientRect(),d=document.createElement('div');d.className='bub';d.textContent=EM[i];d.style.cssText=`left:${r.left+r.width/2}px;top:${s=='o'?r.bottom+6:r.top-40}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);sfx(700,.1,'sine')}

$('dc').onclick=()=>{if(g.sel&&g.sel.h!=null){g.sel.dec=!g.sel.dec;render()}};
async function setTrap(s,hi,zi,dec){const S=g[s],c=CARDS[S.hand[hi]],cost=dec?1:c.c;if(cost>S.mana)return;S.mana-=cost;S.hand.splice(hi,1);S.t[zi]={id:c.id,dec:!!dec,nw:1};render();await sl(100);const[x,y]=ctr($(`t${s}${zi}`));ring(x,y,'#ff8ad0');burst(x,y,'#ff8ad0',26,5);sfx(260,.25,'triangle');await sl(450);render()}
function tzc(s,i){if(s!='p'||busy||g.turn!='p'||g.over||!g.sel||g.sel.h==null||g.p.t[i])return;const h=g.sel.h,c=CARDS[g.p.hand[h]];if(c.k!='t'&&!g.sel.dec)return;const dec=c.k!='t'||!!g.sel.dec;if((dec?1:c.c)>g.p.mana){const[x,y]=ctr($(`t${s}${i}`));flt(x,y-30,'マナ不足','#ffb35a');return}g.sel=null;tx({t:'set',hi:h,zi:i,dec});run(setTrap('p',h,i,dec))}
async function fire(s,i){const S=g[s],c=CARDS[S.t[i].id],[zx,zy]=ctr($(`t${s}${i}`));S.t[i]=null;S.gr.push(c.id);S.gf=1;ring(zx,zy,'#ff8ad0');burst(zx,zy,'#ff8ad0',40,8);flash('#ff3aa0',.45);banner('TRAP OPEN');sfx(330,.5,'square');render();const e=$('cast');e.innerHTML=ch(c,0);e.style.display='block';e.animate([{transform:'scale(.1) rotateY(180deg)',opacity:0},{transform:'scale(1.25)',opacity:1,offset:.35},{transform:'scale(1.25)',opacity:1,offset:.8},{transform:'scale(1.9)',opacity:0}],{duration:1000});await sl(950);e.style.display='none';return c}
async function trig(s,ev,x){const S=g[s],r={};for(let i=0;i<3;i++){const t=S.t[i];if(!t||t.dec||g.over)continue;const f=CARDS[t.id].f;const ok=ev=='atk'?(f=='mir'||(f=='thun'&&x.face)):ev=='sum'?(f=='pit'&&x.m&&x.m.atk>=1500):ev=='spl'?f=='seal':ev=='die'?f=='rev':false;if(!ok)continue;await fire(s,i);const o=s=='p'?'o':'p';if(f=='mir'){r.neg=1;kill(x.as,x.az)}else if(f=='thun'){r.neg=1;hurt(o,1000)}else if(f=='pit'){kill(x.os,x.oz)}else if(f=='seal'){r.neg=1}else if(f=='rev'){hurt(o,1000)}await sl(500);break}return r}
